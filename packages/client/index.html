<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0620" />
    <meta
      name="description"
      content="Gem Rush — a full-stack 5x3 video slot built with PixiJS, TypeScript and Fastify."

    <title>Gem Rush</title>
